[package]
name = "monix-state"
version = "0.1.0"
edition = "2021"
description = "Concurrent state store for Monix telemetry"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
crossbeam-channel = "0.5"

[profile.release]
opt-level = 3
lto = true