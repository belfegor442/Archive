[package]
name = "monix-sensors"
version = "0.1.0"
edition = "2021"
description = "High-volume telemetry sensor parsers for Monix"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
crossbeam-channel = "0.5"
windows = { version = "0.56", features = [
    "Win32_System_SystemInformation",
    "Win32_System_Ioctl",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_NetManagement",
    "Win32_System_Wmi",
    "Win32_Security",
]}]

[profile.release]
opt-level = 3
lto = true